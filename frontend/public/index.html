<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Moshly Time — fullscreen clock, timer, chronometer and countdown with switchable skins." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!--
          Inter is the only font needed for first paint (default skin + UI text
          on all skins). Loaded non-blocking via the media=print/onload swap so
          it never delays first render; falls back to system-ui until ready.
          The other skins' decorative fonts are lazy-loaded on demand in App.js.
        -->
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap"
            rel="stylesheet"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link
                href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap"
                rel="stylesheet"
            />
        </noscript>
        <title>Moshly Time</title>
        <style>
          #app-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: opacity 360ms ease;
          }
          #app-loader.hide {
            opacity: 0;
            pointer-events: none;
          }
          .app-loader-orb {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6B5CFF 0%, #C026D3 60%, #00E5FF 120%);
            filter: blur(0.5px);
            box-shadow: 0 0 40px rgba(107, 92, 255, 0.55),
                        0 0 80px rgba(192, 38, 211, 0.35);
            animation: app-loader-pulse 1.6s ease-in-out infinite;
          }
          @keyframes app-loader-pulse {
            0%, 100% { transform: scale(0.85); opacity: 0.7; }
            50%      { transform: scale(1.15); opacity: 1; }
          }
          @media (prefers-reduced-motion: reduce) {
            .app-loader-orb { animation: none; transform: scale(1); opacity: 0.9; }
            #app-loader { transition: opacity 150ms linear; }
          }
        </style>
    </head>
    <body>
        <div id="app-loader" aria-hidden="true">
            <div class="app-loader-orb"></div>
        </div>
        <noscript>
            <style>#app-loader{display:none}</style>
            You need to enable JavaScript to run this app.
        </noscript>
        <div id="root"></div>
    </body>
</html>
